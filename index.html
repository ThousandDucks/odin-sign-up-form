<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div id="hero">
        <div id="heroImage"></div>
        <div id="logoContainer">
            <img id="logo" src="images/odin-lined.png">
            <span id="logoText">ODIN</span>
        </div>
    </div>


    <div id="mainBody">
        <div id="topTextBody">
            <h1>Your Journey Starts Here</h1>
            From iconic skylines to hidden gems, we help you plan seamless travel experiences across the globe.
        </div>

        <div id="signUp">
            <h1>Let's do this!</h1>
            <form id="signUpSection" action="" method="post">
            
                    <div class="form-row">
                        <div class="signUpDetails">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="signUpDetails">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="signUpDetails">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
            
                        <div class="signUpDetails">
                            <label for="phoneNum">Phone Number</label>
                            <input type="tel" id="phoneNum" name="phoneNum">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="signUpDetails">
                            <label for="password">Password</label>
                            <input type="password" id="userPassword" name="userPassword" required>
                        </div>
                        <div class="signUpDetails">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                    </div>
            </form>
        </div>

        <div id="accountCreation">
            <button type="submit" form="signUpSection">Create Account</button>
        </div>
    </div>
</body>
</html>
